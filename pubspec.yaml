name: smart_wardrobe
description: "Smart Wardrobe Mobile App - Quiet Luxury AI Stylist & Fashion Wardrobe"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking & Storage
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  flutter_dotenv: ^5.2.1
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  google_sign_in_platform_interface: ^3.1.0
  web: ^1.1.0

  # UI, Fonts & Media
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  http: ^1.6.0
  url_launcher: ^6.3.2
  app_links: ^6.4.1
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/mockups/
    - assets/images/
